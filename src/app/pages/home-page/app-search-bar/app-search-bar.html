<div class="search-wrapper">
  <div class="search-input-box" [class.is-focused]="isInputFocused">
    <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
    </svg>

    <input
      type="text"
      placeholder="Semantic search (e.g. joyful memory, groceries)..."
      class="search-input"
      [(ngModel)]="searchText"
      (ngModelChange)="onSearchTextChange($event)"
      (keydown.enter)="search()"
      (focus)="isInputFocused = true"
      (blur)="isInputFocused = false"
    />

    @if (searchText) {
      <button class="clear-btn" (click)="clearSearch()" title="Clear search" type="button">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
      </button>
    }
  </div>

  <button class="search-btn" (click)="search()" [disabled]="!searchText.trim() || isSearching()" type="button">
    @if (isSearching()) {
      <span class="btn-spinner"></span>
    } @else {
      <span>Search</span>
    }
  </button>
</div>
